name: Segurança

# Três varreduras que respondem a perguntas diferentes:
#   1. entrou segredo no histórico?      (gitleaks)
#   2. a dependência nova tem CVE?        (dependency-review, só em PR)
#   3. o código tem padrão inseguro?      (CodeQL)
# Nenhuma delas substitui as outras, e as três são de graça em repositório
# público — que é o caso deste.
on:
  push:
    branches: ["develop", "homolog", "main"]
  pull_request:
    branches: ["develop", "homolog", "main"]
  schedule:
    # Segunda de manhã: CVE nova aparece sem ninguém mexer no código, então a
    # varredura precisa acontecer mesmo numa semana sem commit
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos no histórico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: segredo que vazou há vinte commits continua
          # vazado, mesmo que o arquivo já tenha sido removido depois
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Dependência nova com CVE
    # Só em PR: a ação compara o que ENTRA contra o que já existe, e num push
    # direto não há esse "antes"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Alta e crítica barram o PR; média e baixa entram como comentário
          fail-on-severity: high
          comment-summary-in-pr: always

  codeql:
    name: CodeQL (Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # O pacote de segurança estendido acha coisa que o padrão não acha
          # (injeção por caminho, desserialização), ao custo de mais tempo
          queries: security-extended
      - name: Compilar para o CodeQL
        env:
          BRAPI_TOKEN: dummy
          GEMINI_API_KEY: dummy
          DB_URL: jdbc:h2:mem:test
          DB_USER: sa
          DB_PASSWORD: sa
          JWT_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_
        run: ./mvnw -B compile -DskipTests
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  acoes:
    name: CodeQL (Actions)
    # A própria esteira é código, e roda com um token. O padrão clássico de
    # injeção aqui é interpolar dado do evento (título de PR, nome de branch)
    # dentro de um `run:` — quem abre o PR escolhe o texto, e o texto vira
    # comando. Este scanner existe para isso não passar despercebido no dia em
    # que alguém acrescentar um passo com pressa.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: actions
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:actions"

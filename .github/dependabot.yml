# Atualização de dependência que chega como PR, e não como surpresa no dia em
# que alguém for buildar. O PR cai em `develop`, que é onde o trabalho acontece
# — mandar para `main` furaria o fluxo develop → homolog → main.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    target-branch: develop
    # Cinco por vez: mais do que isso a esteira do plano gratuito engarrafa e
    # ninguém revisa mesmo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Spring sobe em bloco; PRs separados por artefato do mesmo release só
      # geram conflito entre si
      spring:
        patterns: ["org.springframework*", "io.projectreactor*"]
      testes:
        patterns: ["org.junit*", "org.mockito*", "org.assertj*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: chore

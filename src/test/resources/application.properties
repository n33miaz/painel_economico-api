# Desativa o Flyway
spring.flyway.enabled=false

# Configura o banco H2 em memória
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Variáveis de ambiente mockadas
JWT_SECRET=Accc!*qi34$aaMOAuy^9BC$^Fe1700914
BRAPI_TOKEN=dummy_token
NEWS_API_KEY=dummy_key
GEMINI_API_KEY=dummy_key

# Propriedades JWT resolvidas diretamente nos testes
jwt.secret=Accc!*qi34$aaMOAuy^9BC$^Fe1700914
jwt.expiration=86400000
jwt.issuer=economize-test

# Spring AI mockado para subir contexto em testes
spring.ai.openai.api-key=dummy_key
spring.ai.openai.base-url=https://example.test/openai
spring.ai.openai.chat.options.model=test-model

# EC-107: cofre com chave-mestra fixa de teste (32 bytes em Base64). Fixa de
# propósito — a criptografia precisa ser determinística no que importa (ida e
# volta, id da chave), e uma chave aleatória por execução esconderia justamente
# a falha de "não consigo mais ler o que gravei".
economize.secrets.key=dGVzdGUtZGUtY2hhdmUtbWVzdHJhLTMyLWJ5dGVzISE=
economize.secrets.key-id=k1
# Endpoints apontam para host inexistente: nenhum teste pode falar com provedor
# de verdade, e o nome deixa isso explícito se algum tentar.
#
# ESTAS QUATRO LINHAS SÃO TAMBÉM O TESTE VIVO DA FUSÃO campo a campo: elas
# sobrescrevem SÓ o endpoint, e AiProviderPropertiesTest verifica no bean que o
# Spring realmente construiu que label, models e max-tokens continuam de pé. Com
# o binder de mapas escrevendo direto no catálogo (como era antes), estas mesmas
# linhas zeravam o resto do provedor e a suíte seguia verde por cima de um bean
# quebrado — porque nenhum teste usava o bean do contexto.
economize.ai.providers.gemini.endpoint=https://example.test/gemini/chat/completions
economize.ai.providers.openai.endpoint=https://example.test/openai/chat/completions
economize.ai.providers.anthropic.endpoint=https://example.test/anthropic/chat/completions
economize.ai.providers.openrouter.endpoint=https://example.test/openrouter/chat/completions

# Providers externos mockados para carregar o contexto Spring
awesome.api.url=https://example.test/awesome
brapi.api.url=https://example.test/brapi
brapi.api.token=dummy_token

# O balde de requisicoes fica fora do caminho da suite: uma classe de teste
# dispara dezenas de logins do MESMO cliente em segundos, e o limite de
# producao (10/min nas rotas caras) transformaria isso em 429 conforme a ordem
# de execucao. O comportamento do filtro tem suite propria — RateLimitFilterTest.
economize.rate-limit.standard-per-minute=100000
economize.rate-limit.expensive-per-minute=100000

# Agendamento desligado (SchedulingConfig): o contexto sobe várias vezes na
# suíte, e um agendador vivo sairia para a internet buscar feeds RSS no meio
# dos testes. O ciclo de notícias tem suíte própria: NewsRefreshSchedulerTest.
economize.scheduling.enabled=false
# Fontes alternativas de mercado apontam para host inexistente, pela mesma
# razao dos provedores acima: nenhum teste pode falar com fonte de verdade.
economize.market.frankfurter-url=https://example.test/frankfurter
economize.market.coingecko-url=https://example.test/coingecko
economize.market.bcb-sgs-url=https://example.test/sgs
economize.market.ptax-url=https://example.test/ptax
economize.market.treasury-url=https://example.test/tesouro/treasurybondsinfo.json
economize.market.treasury-csv-url=https://example.test/tesouro/precotaxatesourodireto.csv
economize.market.stooq-url=https://example.test/stooq/q/l/
economize.market.yahoo-url=https://example.test/yahoo/v8/finance/chart

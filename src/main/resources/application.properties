spring.application.name=economize-api

# A porta vem do ambiente porque o Render (e qualquer PaaS do tipo) injeta PORT
server.port=${PORT:8080}

# CORS: origens liberadas para o app (lista separada por vírgula);
# o default cobre o dev local do Expo (Metro em 8081 e web em 19006)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}


# API's Externas
awesome.api.url=https://economia.awesomeapi.com.br/json

brapi.api.url=https://brapi.dev/api
brapi.api.token=${BRAPI_TOKEN}

# Spring AI - Google Gemini via interface OpenAI
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-2.0-flash

# Feature flag: sugestão de categoria por IA para o que regras/keywords não
# resolveram. Desligada por padrão — o motor determinístico não depende de LLM.
# Ela governa o uso da CHAVE DO SERVIDOR; desde o EC-107, usuário com chave
# própria cadastrada recebe a sugestão independentemente dela (quem paga é ele).
economize.ai.categorization.enabled=${AI_CATEGORIZATION_ENABLED:false}

# ============================================================================
# EC-107: opções de IA — BYOK multi-provedor
# ============================================================================
# Cofre dos segredos guardados no banco (hoje, só a chave de IA do usuário).
# AES-256-GCM do próprio JDK, sem dependência nova. A chave-mestra são 32 bytes
# em Base64 — gere com: openssl rand -base64 32
#
# SEM a variável, a aplicação sobe normalmente e a opção de chave própria fica
# indisponível (cadastro responde 503, catálogo devolve byokAvailable=false);
# quem usa a chave do servidor não sente diferença. COM a variável preenchida
# errado, a aplicação NÃO sobe — segredo cifrado com chave torta é dano
# permanente e tem que aparecer no boot.
#
# ROTAÇÃO (possível, não implementada): cada segredo guarda o id da chave que o
# cifrou. Para trocar, publique a nova em SECRET_ENCRYPTION_KEY com um novo
# SECRET_ENCRYPTION_KEY_ID e mantenha a antiga em SECRET_ENCRYPTION_PREVIOUS_KEYS
# ("k1:BASE64,k0:BASE64") enquanto ainda houver linhas nela. O saldo se acompanha
# no SQL do Supabase, sem decifrar nada e sem rota de administração:
#   SELECT master_key_id, count(*) FROM user_ai_settings GROUP BY 1;
economize.secrets.key=${SECRET_ENCRYPTION_KEY:}
economize.secrets.key-id=${SECRET_ENCRYPTION_KEY_ID:k1}
economize.secrets.previous-keys=${SECRET_ENCRYPTION_PREVIOUS_KEYS:}

# Provedor que a chave do servidor atende. Só rotulagem: é o que o GET
# /api/v1/ai/settings mostra para quem NÃO tem chave própria. Quem manda de
# verdade nesse caminho continua sendo spring.ai.openai.* acima. Validado contra
# o enum na subida: um valor fora de GEMINI|OPENAI|ANTHROPIC|OPENROUTER derruba o
# boot com o nome do campo, em vez de virar um provider que o app não reconhece.
economize.ai.server-provider=${AI_SERVER_PROVIDER:GEMINI}

# Espera máxima pelo provedor do usuário (LLM é lento) e a do teste de chave.
# economize.ai.timeout=60s
# economize.ai.test-timeout=20s
# economize.ai.max-key-length=512

# Catálogo de provedores/modelos com defaults em código (AiProviderProperties),
# no mesmo esquema do catálogo de ativos e dos feeds de notícia. Id de modelo é
# perecível: acrescentar um lançado ontem é property, não deploy de código.
#
# Sobrescrever um campo NÃO apaga os outros do mesmo provedor — a fusão é campo a
# campo, e o que ficar torto derruba o boot dizendo qual provedor e qual campo.
# As quatro receitas abaixo estão cobertas uma a uma por AiProviderPropertiesTest:
#   economize.ai.providers.openai.extra-models=gpt-4.1-nano
#   economize.ai.providers.openai.models=gpt-4o-mini,gpt-4.1
#   economize.ai.providers.gemini.endpoint=https://.../chat/completions
#   economize.ai.providers.anthropic.max-tokens=8192
# extra-models ACRESCENTA à lista curada (o caso comum: saiu modelo novo);
# models SUBSTITUI a lista inteira (para restringir o que a instalação oferece).
# Não use a forma indexada esparsa (models[4]=...): o binder do Spring exige os
# índices contíguos a partir de zero e recusaria a subida.

# Conector Open Finance via Pluggy (ADR-011, EC-106) — desligado por padrão.
# São DOIS sites: os bancos se conectam em meu.pluggy.ai, mas as credenciais
# saem de dashboard.pluggy.ai (aplicação de desenvolvimento). Desde o EC-106 os
# itens são POR USUÁRIO (tabela pluggy_items, criados pelo widget Pluggy
# Connect via /connect-token + /items) — só as credenciais da aplicação vivem
# no ambiente.
economize.pluggy.enabled=${PLUGGY_ENABLED:false}
economize.pluggy.base-url=${PLUGGY_BASE_URL:https://api.pluggy.ai}
economize.pluggy.client-id=${PLUGGY_CLIENT_ID:}
economize.pluggy.client-secret=${PLUGGY_CLIENT_SECRET:}
# LEGADO (fase de itens globais): hoje funcionam só como SEMENTE — na primeira
# sync da conta PLUGGY_OWNER_EMAIL, os ids abaixo migram para pluggy_items e a
# tabela vira a fonte única. Enquanto a variável existir ela re-semeia item
# removido; para desvincular de vez um item semeado, tire-o daqui também.
economize.pluggy.item-ids=${PLUGGY_ITEM_IDS:}
economize.pluggy.owner-email=${PLUGGY_OWNER_EMAIL:}

# Banco de Dados (Supabase em producao)
#
# DB_URL continua sendo a forma normal de dizer onde e o banco. O default
# monta a URL a partir de host/porta/nome porque e assim que o Render
# entrega os dados de um banco criado pelo proprio blueprint (homologacao):
# la nao existe uma variavel com a URL JDBC pronta, e sim uma propriedade
# por campo. Sem isto, homologacao exigiria colar a URL a mao a cada vez
# que o banco fosse recriado.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:economize}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT (24 horas)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.issuer=economize

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# A identidade da build vem do build-info gerado pelo plugin (ver pom), e não
# de propriedade escrita à mão: a versão daqui anunciava 2.0.0 contra um build
# 1.0.0-SNAPSHOT e, pior, nem aparecia — o contribuidor de ambiente do Actuator
# vem desligado por padrão, então /actuator/info respondia `{}`
management.info.build.enabled=true
management.info.java.enabled=true

# Configuração do Resilience4j
resilience4j.circuitbreaker.instances.indicators.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.indicators.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.indicators.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.indicators.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.indicators.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.indicators.sliding-window-size=10

# Fallback automático se o circuito abrir nos providers externos
resilience4j.circuitbreaker.instances.providers.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.providers.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.providers.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.providers.sliding-window-size=10
resilience4j.retry.instances.providers.max-attempts=3
resilience4j.retry.instances.providers.wait-duration=500ms
resilience4j.retry.instances.providers.enable-exponential-backoff=true
resilience4j.retry.instances.providers.exponential-backoff-multiplier=2

# RabbitMQ é opcional: precisa do profile "rabbit" (ver service/event/rabbit).
# Sem broker rodando, o indicador de health dele derrubaria o /actuator/health
# agregado — e o health check do provedor de deploy junto.
management.health.rabbit.enabled=${RABBITMQ_HEALTH_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:economize}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:economize}

# ============================================================================
# EC-089: recuperação e troca de senha
# ============================================================================
# Envio de e-mail: desligado por padrão — LogEmailSender só registra em log.
# Com true, SmtpEmailSender envia via SMTP usando spring.mail.* (vindas do
# ambiente). Como o starter de mail está no classpath, o health indicator de
# mail segue a mesma estratégia do RabbitMQ acima: sem SMTP configurado ele
# derrubaria o /actuator/health agregado.
economize.mail.enabled=${MAIL_ENABLED:false}
management.health.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sem timeout o default do JavaMail e infinito: SMTP travado seguraria a thread
# do boundedElastic e a conexao do pool indefinidamente
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Base do link de redefinição enviado por e-mail (o token vai em ?token=)
economize.app.reset-url-base=${RESET_URL_BASE:https://economize-web.onrender.com/reset-password}

# --- EC-099: catálogo ampliado + paginação ---
# O catálogo de ativos da B3 tem defaults em código (MarketCatalogProperties);
# moedas e cripto não estão lá porque a AwesomeAPI devolve o universo inteiro em
# uma chamada só. Tudo é sobrescrevível por properties, ex.:
#   economize.catalog.assets[0].symbol=PETR4
#   economize.catalog.assets[0].name=Petrobras PN
#   economize.catalog.assets[0].type=stock
#   economize.catalog.assets[0].segment=acoes
#   economize.catalog.assets[0].rank=96
# Os tetos diários existem porque a Brapi cobra uma requisição por ticker contra
# uma cota de ~1.000/dia, e TODAS as chamadas (o /all da Home, o catálogo e a
# busca) saem do mesmo bolso — o controle fica num ponto só, no BrapiProvider.
#   daily-provider-budget  teto de tudo somado no dia
#   daily-quote-budget     fatia da demanda ABERTA (catálogo + busca); o resto
#                          fica reservado ao /all, cujo pior caso é fixo:
#                          24h / 30min de cache = 48 recargas × 7 tickers = 336
# Ver a aritmética completa em QuoteBudget e o teste dailyBudgetMustLeaveHeadroom.
# economize.catalog.daily-provider-budget=850
# economize.catalog.daily-quote-budget=500
# economize.catalog.max-quotes-per-page=20
# economize.catalog.default-page-size=15
# economize.catalog.max-page-size=50
# economize.catalog.quote-ttl=30m
# economize.catalog.rank-window=10m

# --- EC-101: agregador de notícias ---
# O catálogo de feeds RSS tem defaults em código (NewsFeedsProperties) e pode
# ser sobrescrito por properties, ex.:
#   economize.news.feeds[0].id=infomoney
#   economize.news.feeds[0].name=InfoMoney
#   economize.news.feeds[0].url=https://www.infomoney.com.br/feed/
#   economize.news.feeds[0].region=br
#   economize.news.feeds[0].category=economia
# economize.news.feed-timeout=10s
# economize.news.items-per-feed=10

# --- Radar de notícias em segundo plano ---
# Os feeds deixaram de ser baixados na requisição do usuário: um agendador
# (NewsRefreshScheduler) os busca de tempos em tempos, poucos por vez e com GET
# condicional (ETag / If-Modified-Since), e guarda o agregado em memória
# (NewsSnapshotStore). A requisição só filtra o que já está lá. Motivo: no plano
# free (0,1 CPU) onze downloads TLS simultâneos não cabiam no timeout, todos
# falhavam juntos e o cache guardava a resposta vazia por 10 min.
# O feed-timeout de 10s acima era o da busca síncrona; o default agora é 8s.
# economize.news.refresh-interval=PT10M
# economize.news.feed-timeout=8s
# economize.news.max-age=3d
# economize.news.concurrency=2
# economize.news.items-per-feed=20
# O agendamento (@EnableScheduling, em SchedulingConfig) pode ser desligado por
# inteiro; a suíte de testes faz isso para não sair para a internet.
# economize.scheduling.enabled=true

# --- Investimentos: posições consolidadas, movimentos do extrato e perfil ---
# O sync de posições (POST /api/v1/investments/sync) usa o conector Pluggy
# acima: com PLUGGY_ENABLED=false a rota responde 503 e o resto do módulo
# (cadastro manual, movimentos derivados do extrato, resumo e perfil) segue
# funcionando — investimento em corretora no exterior nunca dependeu dele.
#
#   movement-months-default  janela de GET /movements quando ?months= não vem
#   max-manual-positions     teto de posições MANUAL por usuário; não é limite
#                            de negócio, é rede contra script — o resumo e o
#                            perfil varrem todas as posições a cada leitura
economize.investments.movement-months-default=12
economize.investments.max-manual-positions=200
# ============================================================================
# Versão mínima do app, conector Open Finance neutro e planos (V23)
# ============================================================================
# Vínculo app <-> API/banco. O app manda X-App-Version e X-App-Platform; abaixo
# da mínima toda chamada responde 426 com a URL de download (AppVersionFilter),
# e GET /api/v1/app/version (público) anuncia mínima, recente, versão da build
# da API e a maior migration do classpath. Suba APP_MIN_VERSION quando uma
# migration mudar o contrato que o app antigo entende.
economize.app.min-version=${APP_MIN_VERSION:2.2.0}
economize.app.latest-version=${APP_LATEST_VERSION:2.2.0}
economize.app.download-url=${APP_DOWNLOAD_URL:https://economize-web.onrender.com/baixar}
# Loja, quando houver listagem (vazio = null na resposta)
economize.app.store-url=${APP_STORE_URL:}
# Texto da tela de atualização. Os \u00XX são acentos: o Spring lê .properties
# como ISO-8859-1, e um "ã" literal aqui chegaria torto ao app.
economize.app.update-message=${APP_UPDATE_MESSAGE:H\u00e1 uma nova vers\u00e3o do Economize!. Atualize o aplicativo para continuar.}
# Requisição SEM X-App-Version passa: a base 2.2.0 publicada ainda não manda o
# cabeçalho. Com true, ausência = cliente legado = 426. Ligue só quando a
# primeira versão que manda o cabeçalho for a mínima aceitável — e lembre que o
# "Try it out" do Swagger também não manda cabeçalho nenhum. A plataforma web
# nunca é barrada por versão (vem sempre do último deploy do site).
economize.app.block-legacy-clients=${APP_BLOCK_LEGACY_CLIENTS:false}

# Provedor do conector Open Finance (porta OpenFinanceProvider). Hoje o único
# valor com implementação é "pluggy", e ele só sobe se economize.pluggy.enabled
# também estiver true. Qualquer outro valor deixa a instalação sem conector
# (NoOpOpenFinanceProvider: status enabled=false, operações 503) — uma segunda
# implementação se pendura no próprio id aqui. É o ponto de troca; o app nunca
# vê este nome, só /api/v1/connectors/status.
economize.connector.provider=${CONNECTOR_PROVIDER:pluggy}
# Script do widget que a página-ponte do site carrega — vem da API para o site
# não ter URL fixa de provedor. Subir a versão do widget é property, não deploy.
economize.pluggy.widget-script-url=${PLUGGY_WIDGET_SCRIPT_URL:https://cdn.pluggy.ai/pluggy-connect/v2.8.2/pluggy-connect.js}

# Planos (V23): FREE com anúncios e PLUS sem. Preço e vantagens têm default em
# código (PlanProperties, inclusive as do FREE em economize.plans.free.*) e são
# sobrescrevíveis aqui. Ainda não há cobrança: checkout-available fica false e
# o app oferece "tenho interesse", que POST /api/v1/plans/interest registra
# (idempotente) para o dono medir demanda. Acentos em \u00XX pelo mesmo motivo
# da mensagem de atualização.
economize.plans.plus.name=${PLAN_PLUS_NAME:Economize! Plus}
economize.plans.plus.price-monthly=${PLAN_PLUS_PRICE_MONTHLY:9.90}
economize.plans.plus.features=${PLAN_PLUS_FEATURES:Sem an\u00fancios,Conex\u00e3o banc\u00e1ria ilimitada,Relat\u00f3rios em PDF,Prioridade no assistente}
economize.plans.checkout-available=${PLAN_CHECKOUT_AVAILABLE:false}
# --- Fontes de mercado: orçamento da AwesomeAPI e fontes alternativas ---
# A AwesomeAPI (moedas e cripto da Home) responde 429 QuotaExceeded com
# frequência e não publica o teto anônimo por dia — a documentação só fala em
# "100 mil requisições mensais" para quem tem chave e em 100/1500 REGISTROS por
# chamada nos endpoints sequenciais. O orçamento abaixo é um teto nosso, por dia
# UTC e por instância: estourado, a Home vai direto às fontes alternativas sem
# nem chamar a AwesomeAPI (um 429 a mais só aprofunda o bloqueio). A conta:
# /all a cada 30 min = 48/dia + histórico (cache de 1h por moeda/janela) ≤ 72.
# Ver AwesomeApiBudget.
economize.market.awesome-daily-budget=${AWESOME_DAILY_BUDGET:120}
# Cadeia de fallback (AwesomeApiProvider): moedas → Frankfurter (BCE) → PTAX do
# BCB; cripto → CoinGecko; histórico → SGS do BCB (moedas) / CoinGecko (cripto);
# só depois disso o snapshot persistido (tabela market_snapshots, V25), que
# agora sobrevive ao reinício do container e é servido por até 7 dias, marcado
# stale e datado. Todas as URLs abaixo têm default em código
# (MarketSourcesProperties); existem como property para os testes apontarem
# para um servidor falso e para trocar de endereço sem deploy — o JSON oficial
# do Tesouro Direto já responde 410 Gone, e o CSV do Tesouro Transparente é o
# que funciona hoje.
# economize.market.frankfurter-url=https://api.frankfurter.app
# economize.market.coingecko-url=https://api.coingecko.com/api/v3
# economize.market.bcb-sgs-url=https://api.bcb.gov.br/dados/serie
# economize.market.ptax-url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
# economize.market.treasury-url=https://www.tesourodireto.com.br/json/br/com/b3/tesourodireto/service/api/treasurybondsinfo.json
# economize.market.treasury-csv-url=https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/precotaxatesourodireto.csv
# economize.market.stooq-url=https://stooq.com/q/l/
# economize.market.yahoo-url=https://query1.finance.yahoo.com/v8/finance/chart
# economize.market.browser-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36
